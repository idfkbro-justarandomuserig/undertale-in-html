name: Build Android APK

on:
  push:
    branches:
      - claude/repo-wipe-tip9ef
      - main
      - master
    paths:
      - 'phone/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    # GitHub-hosted ubuntu runners ship with the Android SDK preinstalled,
    # which is exactly what a Capacitor/Gradle Android build needs and what
    # a plain sandbox (no direct access to dl.google.com) can't provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install phone/ dependencies
        working-directory: phone
        run: npm install

      - name: Sync Capacitor web assets into the native project
        working-directory: phone
        run: npx cap sync android

      - name: Build debug APK
        working-directory: phone/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resale-dashboard-debug-apk
          path: phone/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
